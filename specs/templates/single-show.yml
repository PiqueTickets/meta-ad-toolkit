preflight:
  - parent_adset_must_exist: "<<parent_adset_id>>"

# =============================================================================
# DELIBERATE OMISSIONS (counter-lessons from the source campaign)
# =============================================================================
#
# - No URGENCY-72H ad set. The source campaign's urgency push spent $30 with
#   $0 revenue — same audience and overlapping creative as the main set.
#   Only add an urgency ad set if you have distinct creative (countdown video,
#   low-inventory frame, artist direct-to-camera) AND exclude purchasers from
#   the main set.
# - No detailed-interest targeting. Custom-audience seeds + Advantage Audience
#   beat interest targeting in every Acme Events campaign that's tried both.
# - No CBO. Keep budget at the ad-set level so an urgency push (when warranted)
#   can be funded on its own timeline without robbing the main set.
# =============================================================================
